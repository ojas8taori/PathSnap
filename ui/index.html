<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap evaluator</title>
  <style>
    :root { color-scheme: light; font: 16px/1.45 system-ui, sans-serif; color: #17212b; background: #f2f5f7; }
    body { margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    header, section { background: #fff; border: 1px solid #d8e0e5; border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; }
    h1 { margin: 0 0 4px; font-size: 1.55rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
    select, button { font: inherit; padding: 9px 12px; border-radius: 7px; border: 1px solid #9eacb5; background: white; }
    button { background: #124f77; border-color: #124f77; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.5em; margin-top: 10px; color: #425466; }
    #status.error { color: #9e2f28; }
    .metrics { display: flex; gap: 24px; flex-wrap: wrap; }
    .metric strong { display: block; font-size: 1.3rem; }
    #map { width: 100%; height: min(66vh, 620px); background: #f8fafb; border: 1px solid #d8e0e5; border-radius: 8px; }
    .legend { display: flex; gap: 20px; flex-wrap: wrap; color: #425466; font-size: .9rem; margin-top: 10px; }
    .swatch { display: inline-block; width: 20px; height: 3px; vertical-align: middle; margin-right: 6px; }
    #api { color: #667784; font-size: .85rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>PathSnap evaluator</h1>
    <div>Select a trip to request a route prediction from the PathSnap API.</div>
    <div class="controls">
      <label for="trip">Evaluation trip</label>
      <select id="trip" disabled><option>Loading trip IDs…</option></select>
      <button id="predict" disabled>Predict route</button>
    </div>
    <div id="status" role="status">Connecting to API…</div>
    <div id="api"></div>
  </header>
  <section>
    <div class="metrics" id="metrics">Select a trip to see permitted evaluation metrics.</div>
  </section>
  <section>
    <svg id="map" viewBox="0 0 1000 600" role="img" aria-label="GPS observations and predicted road path"></svg>
    <div class="legend">
      <span><i class="swatch" style="background:#2474a6"></i>GPS trace</span>
      <span><i class="swatch" style="background:#c23c32"></i>Predicted road path</span>
    </div>
  </section>
</main>
<script>
let apiBase = "";
const tripSelect = document.getElementById("trip");
const button = document.getElementById("predict");
const statusBox = document.getElementById("status");
const map = document.getElementById("map");
const metricsBox = document.getElementById("metrics");
function status(message, error=false) { statusBox.textContent = message; statusBox.className = error ? "error" : ""; }
function line(points, color, width, opacity) {
  if (!points.length) return;
  const coords = points.map(([x,y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(" ");
  const el = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  el.setAttribute("points", coords); el.setAttribute("fill", "none"); el.setAttribute("stroke", color);
  el.setAttribute("stroke-width", width); el.setAttribute("stroke-opacity", opacity); el.setAttribute("stroke-linejoin", "round"); el.setAttribute("stroke-linecap", "round");
  map.appendChild(el);
}
function draw(data) {
  map.replaceChildren();
  const all = [...data.gps_points, ...data.predicted_path.filter(Boolean).flat()];
  if (!all.length) return;
  const lats = all.map(p => p[0]), lons = all.map(p => p[1]);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const pad = 35, width = 1000, height = 600;
  const spanLon = Math.max(1e-8, maxLon-minLon), spanLat = Math.max(1e-8, maxLat-minLat);
  const scale = Math.min((width-2*pad)/spanLon, (height-2*pad)/spanLat);
  const toXY = ([lat,lon]) => [pad+(lon-minLon)*scale, height-pad-(lat-minLat)*scale];
  line(data.gps_points.map(toXY), "#2474a6", 2, .48);
  for (const arc of data.predicted_path) if (arc) line(arc.map(toXY), "#c23c32", 3, .9);
  const first = data.gps_points[0], last = data.gps_points[data.gps_points.length-1];
  for (const [point, fill] of [[first,"#2474a6"],[last,"#17212b"]]) {
    const [cx,cy] = toXY(point); const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",5); c.setAttribute("fill",fill); map.appendChild(c);
  }
}
function metric(label, value) {
  const div = document.createElement("div"); div.className="metric";
  const strong=document.createElement("strong"); strong.textContent=value;
  const span=document.createElement("span"); span.textContent=label;
  div.append(strong,span); metricsBox.appendChild(div);
}
async function loadTrips() {
  try {
    const response = await fetch(`${apiBase}/trips`);
    if (!response.ok) throw new Error(`Trip list request failed (${response.status})`);
    const data = await response.json(); tripSelect.replaceChildren();
    for (const id of data.trip_ids) { const option=document.createElement("option"); option.value=id; option.textContent=id; tripSelect.appendChild(option); }
    tripSelect.disabled = data.trip_ids.length === 0; button.disabled = data.trip_ids.length === 0;
    status(data.trip_ids.length ? `Loaded ${data.trip_ids.length} evaluator trip IDs.` : "The API has no evaluator trip IDs configured.");
  } catch (e) { status(`${e.message}. Check the API URL and API host logs.`, true); }
}
button.addEventListener("click", async () => {
  button.disabled=true; status(`Predicting trip ${tripSelect.value}…`); metricsBox.textContent="";
  try {
    const response=await fetch(`${apiBase}/predict`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({trip_id:tripSelect.value})});
    const data=await response.json(); if (!response.ok) throw new Error(data.detail || `Prediction failed (${response.status})`);
    draw(data); metric("Pointwise accuracy", data.metrics.pointwise_accuracy == null ? "N/A" : `${(100*data.metrics.pointwise_accuracy).toFixed(1)}%`);
    metric("Macro F1", data.metrics.macro_f1 == null ? "N/A" : data.metrics.macro_f1.toFixed(3));
    metric("Candidate miss rate", data.metrics.candidate_miss_rate == null ? "N/A" : `${(100*data.metrics.candidate_miss_rate).toFixed(1)}%`);
    status(`Received API prediction for ${data.trip_id} (${data.predicted_arc_ids.length} GPS observations).`);
  } catch(e) { status(e.message, true); }
  finally { button.disabled=false; }
});
(async () => {
  try { const config=await (await fetch("config.json")).json(); apiBase=config.apiBaseUrl.replace(/\/$/,""); document.getElementById("api").textContent=`API: ${apiBase}`; await loadTrips(); }
  catch(e) { status(`Could not load ui/config.json: ${e.message}`, true); }
})();
</script>
</body>
</html>
